services:
  - type: web
    name: flora-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python manage.py seed_products && gunicorn flora_backend.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/products/
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: https://flora-storefront.onrender.com

  - type: web
    name: flora-storefront
    runtime: static
    buildCommand: npm ci && REACT_APP_API_URL="https://${API_HOST}/api" npm run build
    staticPublishPath: build
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: flora-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
